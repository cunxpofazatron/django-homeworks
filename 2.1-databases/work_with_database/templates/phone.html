{% extends "base.html" %}

{% block title %}{{ phone.name }}{% endblock %}

{% block content %}
  <div class="container">
    <h1>{{ phone.name }}</h1>

    <p><strong>Цена:</strong> {{ phone.price }} ₽</p>
    <p><strong>Дата выхода:</strong> {{ phone.release_date }}</p>
    <p><strong>LTE:</strong> {{ phone.lte_exists|yesno:"Да,Нет" }}</p>

    <img class="product-img" src="{{ phone.image }}" alt="{{ phone.name }}">
  </div>
{% endblock %}
